version: "3.9"
services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
